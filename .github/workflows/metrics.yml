name: Metrics
on:
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check metrics token
        id: check-metrics-token
        run: |
          if [ -z "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "::warning::METRICS_TOKEN is not set. Skipping metrics generation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: lowlighter/metrics@latest
        if: steps.check-metrics-token.outputs.skip != 'true'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amiinemohamed
          template: classic
          base: header, activity, community, repositories
          output_action: commit
          filename: metrics.base.svg

      - uses: lowlighter/metrics@latest
        if: steps.check-metrics-token.outputs.skip != 'true'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amiinemohamed
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          output_action: commit
          filename: metrics.languages.svg

      - uses: lowlighter/metrics@latest
        if: steps.check-metrics-token.outputs.skip != 'true'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amiinemohamed
          base: ""
          plugin_habits: yes
          plugin_habits_days: 14
          plugin_habits_charts: yes
          output_action: commit
          filename: metrics.habits.svg

      - uses: lowlighter/metrics@latest
        if: steps.check-metrics-token.outputs.skip != 'true'
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: amiinemohamed
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit
          filename: metrics.isocalendar.svg
