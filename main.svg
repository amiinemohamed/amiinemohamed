<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title description">
  <title id="title">Amine Mohamed</title>
  <desc id="description">
    ML engineer, software engineer, and graphic designer.
    A looping terminal-style introduction with boot, reveal,
    glitch, and hold states.
  </desc>

  <defs>
    <clipPath id="bounds">
      <rect width="1200" height="360"/>
    </clipPath>
    <pattern id="grid" x="32" y="43"
             width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M0 .5H48M.5 0V48"
            fill="none" stroke="#63ff4d"
            stroke-opacity=".055"/>
    </pattern>
    <pattern id="scanlines"
             width="5" height="5" patternUnits="userSpaceOnUse">
      <rect y="2" width="5" height="1"
            fill="#050806" fill-opacity=".18"/>
    </pattern>
  </defs>

  <style>
    .motion {
      animation-duration: 4.75s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
    }

    .grid { animation-name: grid-drift; }
    .glow { animation-name: glow-drift; }
    .orbit { animation-name: orbit-drift; }
    .scan { animation-name: scan-sweep; }
    .name { animation-name: name-reveal; }
    .ghost { animation-name: name-glitch; }

    @keyframes name-reveal {
      0%, 11.578947% {
        transform: translateX(-22px);
        opacity: .14;
      }
      21.052632%, 32.631579% {
        transform: translateX(0);
        opacity: 1;
      }
      42.105263%, 53.684211% {
        transform: translateX(6px);
        opacity: 1;
      }
      63.157895%, 90.526316% {
        transform: translateX(0);
        opacity: 1;
      }
      100% {
        transform: translateX(-22px);
        opacity: .14;
      }
    }

    @keyframes name-glitch {
      0%, 32.631579% { opacity: 0; }
      42.105263%, 53.684211% { opacity: .22; }
      63.157895%, 100% { opacity: 0; }
    }

    @keyframes scan-sweep {
      0%, 11.578947%, 100% {
        transform: translateY(-246px);
      }
      21.052632%, 32.631579% {
        transform: translateY(-178px);
      }
      42.105263%, 53.684211% {
        transform: translateY(-94px);
      }
      63.157895%, 90.526316% {
        transform: translateY(0);
      }
    }

    @keyframes grid-drift {
      0%, 11.578947%, 100% {
        transform: translate(-24px, -15px);
      }
      21.052632%, 32.631579% {
        transform: translate(-16px, -10px);
      }
      42.105263%, 53.684211% {
        transform: translate(-8px, -5px);
      }
      63.157895%, 90.526316% {
        transform: translate(0, 0);
      }
    }

    @keyframes glow-drift {
      0%, 11.578947%, 100% {
        transform: translateX(-12px);
      }
      21.052632%, 32.631579% {
        transform: translateX(-8px);
      }
      42.105263%, 53.684211% {
        transform: translateX(-4px);
      }
      63.157895%, 90.526316% {
        transform: translateX(0);
      }
    }

    @keyframes orbit-drift {
      0%, 11.578947%, 100% {
        transform: translateX(9px);
      }
      21.052632%, 32.631579% {
        transform: translateX(6px);
      }
      42.105263%, 53.684211% {
        transform: translateX(3px);
      }
      63.157895%, 90.526316% {
        transform: translateX(0);
      }
    }

    .banner {
      position: relative;
      width: 1200px;
      height: 360px;
      overflow: hidden;
      color: #d6e6d4;
      font-family: Inter, Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .banner * {
      box-sizing: border-box;
      margin: 0;
    }

    .label, .status, .prompt,
    .headline, .roles, .quote, .meta {
      position: absolute;
    }

    .label {
      left: 48px;
      top: 18px;
      color: #3d7d38;
      font-size: 9px;
      font-weight: 500;
      line-height: 11px;
      letter-spacing: 1.3px;
    }

    .status {
      left: 1014px;
      top: 18px;
      color: #63ff4d;
      font-size: 9px;
      font-weight: 500;
      line-height: 11px;
      letter-spacing: 1.1px;
      white-space: pre;
    }

    .prompt {
      left: 52px;
      top: 78px;
      color: #63ff4d;
      font-size: 11px;
      font-weight: 500;
      line-height: 13px;
      letter-spacing: 1.8px;
    }

    .headline {
      left: 52px;
      top: 104px;
      color: #b3ff99;
      font-size: 64px;
      font-weight: 700;
      line-height: 77px;
      letter-spacing: -2.6px;
      white-space: nowrap;
    }

    .ghost {
      left: 48px;
      top: 108px;
      color: #63ff4d;
      opacity: 0;
    }

    .roles {
      left: 54px;
      top: 187px;
      font-size: 12px;
      font-weight: 500;
      line-height: 15px;
      letter-spacing: 1.25px;
      white-space: pre;
    }

    .quote {
      left: 54px;
      top: 242px;
      font-size: 17px;
      font-weight: 400;
      line-height: 26px;
      letter-spacing: .1px;
    }

    .meta {
      left: 905px;
      top: 244px;
      color: #6b856e;
      font-size: 10px;
      font-weight: 500;
      line-height: 19px;
      letter-spacing: 1px;
    }

    @media (prefers-reduced-motion: reduce) {
      .motion { animation: none !important; }
    }
  </style>

  <g clip-path="url(#bounds)">
    <rect width="1200" height="360" fill="#050806"/>

    <rect class="motion grid"
          x="-48" y="-48" width="1296" height="456"
          fill="url(#grid)"/>

    <g class="motion glow">
      <circle cx="1032" cy="70" r="260"
              fill="#63ff4d" fill-opacity=".025"/>
      <circle cx="1032" cy="70" r="259.5"
              fill="none" stroke="#63ff4d"
              stroke-opacity=".1"/>
    </g>

    <circle class="motion orbit"
            cx="1001" cy="191" r="124.5"
            fill="none" stroke="#63ff4d"
            stroke-opacity=".18"/>

    <rect x="48" y="38" width="1104" height="1"
          fill="#63ff4d" fill-opacity=".3"/>

    <rect x="54" y="217" width="715" height="1"
          fill="#63ff4d" fill-opacity=".24"/>

    <foreignObject x="0" y="0" width="1200" height="360">
      <div xmlns="http://www.w3.org/1999/xhtml" class="banner">
        <div class="label">README_SIGNAL / AMINE_MOHAMED</div>
        <div class="status">●  SYSTEM ONLINE</div>
        <div class="prompt">&gt; HELLO, WORLD. I'M</div>

        <h1 class="headline motion name">AMINE MOHAMED</h1>
        <div class="headline motion ghost" aria-hidden="true">
          AMINE MOHAMED
        </div>

        <div class="roles">ML ENGINEER  +  SOFTWARE ENGINEER  +  GRAPHIC DESIGNER</div>

        <div class="quote">
          “Learn how to use AI in code —<br/>
          and never let AI use us for code.”
        </div>

        <div class="meta">
          M.SC. ARTIFICIAL INTELLIGENCE<br/>
          CADI AYYAD UNIVERSITY
        </div>
      </div>
    </foreignObject>

    <rect class="motion scan"
          y="304" width="1200" height="3"
          fill="#63ff4d" fill-opacity=".13"/>

    <rect width="1200" height="360"
          fill="url(#scanlines)"/>
  </g>
</svg>
